<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eris — La Diosa del Caos</title>
  <meta name="description" content="Eris - Asistente de IA personal de Alex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <span class="logo-icon">⚡</span>
          <span class="logo-text">ERIS</span>
        </div>
        <button id="btn-new-chat" class="btn-new-chat" title="Nuevo chat">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
      </div>

      <!-- Conversations List -->
      <div class="sidebar-conversations">
        <div id="conversations-list" class="conversations-list"></div>
      </div>

      <!-- Status -->
      <div class="sidebar-status" id="status-panel">
        <div class="status-item">
          <span class="status-dot" id="ollama-dot"></span>
          <span class="status-label">Ollama</span>
          <span class="status-value" id="ollama-status">Conectando...</span>
        </div>
        <div class="status-item">
          <span class="status-dot online"></span>
          <span class="status-label">Modelo</span>
          <span class="status-value" id="model-name">—</span>
        </div>
      </div>

      <div class="sidebar-tools">
        <h3 class="sidebar-title">Herramientas</h3>
        <div id="tools-list" class="tools-list"></div>
      </div>
    </aside>

    <!-- Main Chat Area -->
    <main id="chat-area">
      <!-- Welcome Screen -->
      <div id="welcome-screen" class="welcome">
        <div class="welcome-logo">
          <div class="welcome-icon">⚡</div>
          <h1 class="welcome-title">ERIS</h1>
          <p class="welcome-subtitle">La Diosa del Caos</p>
        </div>
        <div class="welcome-chips">
          <button class="chip" data-msg="¿Qué hora es?">🕐 ¿Qué hora es?</button>
          <button class="chip" data-msg="¿Cuánta RAM tengo disponible?">💾 Info de mi RAM</button>
          <button class="chip" data-msg="Busca en internet qué es TypeScript">🌐 Buscar en la web</button>
          <button class="chip" data-msg="Muestra la info de mi sistema">⚙️ Info del sistema</button>
        </div>
      </div>

      <!-- Messages Container -->
      <div id="messages" class="messages"></div>

      <!-- Thinking Indicator -->
      <div id="thinking" class="thinking hidden">
        <div class="thinking-dots">
          <span></span><span></span><span></span>
        </div>
        <span id="thinking-text">Pensando...</span>
      </div>

      <!-- Input Area -->
      <div class="input-area">
        <div class="input-container">
          <textarea
            id="message-input"
            placeholder="Escríbele a Eris..."
            rows="1"
            autofocus
          ></textarea>
          <button id="btn-send" class="btn-send" title="Enviar (Enter)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
        <p class="input-hint">Enter para enviar · Shift+Enter para nueva línea</p>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
